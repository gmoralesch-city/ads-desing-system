<!-- @dsCard group="Consola de negocios" viewport="1440x900" name="Consola de negocios" subtitle="Filtros laterales, tabla con orden y paginación, modales con validación" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consola de negocios · Aseguradora del Sur</title>
<link rel="stylesheet" href="../../styles.css">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:#fff;font-family:var(--font-brand)}
#root{min-height:100vh}
.consola{max-width:1440px;margin:0 auto;padding:40px 48px 64px}
.consola-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px}
.consola-head h1{margin:0;font-weight:300;font-size:48px;line-height:1;color:var(--text-strong)}
.consola-head p{margin:10px 0 0;font-size:18px;color:var(--text-muted)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:20px}
.buscar{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border:1px solid var(--border-default);border-radius:var(--radius-sm);background:#fff;flex:1 1 280px;min-width:0;max-width:420px}
.buscar input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-family:var(--font-brand);font-size:15px;color:var(--text-strong)}
.chips-activos{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.link-clear{border:none;background:transparent;padding:0;cursor:pointer;font-family:var(--font-brand);font-weight:500;font-size:14px;color:var(--text-link);text-decoration:underline;text-underline-offset:3px}
.icon-round{width:40px;height:40px;flex-shrink:0;border:none;border-radius:999px;background:var(--neutral-100);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:var(--transition-action)}
.icon-round:hover{background:var(--neutral-200)}
/* tabla */
.tabla-wrap{overflow-x:auto;background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-sm)}
.tabla{width:100%;border-collapse:collapse}
.tabla thead tr{background:var(--teal-100)}
.tabla th{padding:16px 20px;font-family:var(--font-brand);font-weight:500;font-size:14px;color:var(--text-strong);white-space:nowrap;vertical-align:middle}
.tabla th span{display:inline-block}
.th-sort{display:inline-flex;align-items:center;gap:6px;width:100%;border:none;background:transparent;padding:0;cursor:pointer;font-family:var(--font-brand);font-weight:500;font-size:14px;color:var(--text-strong)}
.th-sort:hover{color:var(--color-brand-dark)}
.tabla td{padding:16px 20px;border-top:1px solid var(--border-subtle);font-family:var(--font-body);font-size:14px;color:var(--text-body);vertical-align:middle}
.tabla tbody tr:hover{background:var(--table-row-hover)}
.row-eye,.row-kebab{border:none;background:transparent;padding:2px;border-radius:6px;cursor:pointer;color:var(--text-muted);display:inline-flex;transition:var(--transition-action)}
.row-eye:hover,.row-kebab:hover{color:var(--color-brand-dark);background:var(--cyan-100)}
.tabla-vacia{margin:0;padding:48px 20px;text-align:center;font-family:var(--font-brand);font-size:16px;color:var(--text-muted)}
.tabla-cards{display:none;flex-direction:column;gap:12px}
.neg-card{background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:16px;display:flex;flex-direction:column;gap:12px}
.neg-card h3{margin:0;font-family:var(--font-brand);font-weight:500;font-size:18px;color:var(--text-strong)}
.neg-card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-family:var(--font-body);font-size:14px}
.neg-card dt{color:var(--text-muted)}
.neg-card dd{margin:0;color:var(--text-body);text-align:right}
.tabla-pie{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:16px 20px}
.pie-res{font-family:var(--font-brand);font-weight:500;font-size:12px;color:var(--text-muted)}
.pie-nav{display:flex;flex-wrap:wrap;align-items:center;gap:20px}
.pie-per{display:flex;align-items:center;gap:8px;font-family:var(--font-brand);font-size:12px;color:var(--text-muted)}
.detalle-grid{margin:0;display:grid;grid-template-columns:auto 1fr;gap:10px 20px;font-family:var(--font-body);font-size:14px}
.detalle-grid dt{color:var(--text-muted)}
.detalle-grid dd{margin:0;color:var(--text-strong);text-align:right}
/* drawer de filtros */
.drawer-scrim{position:fixed;inset:0;background:var(--scrim-drawer);opacity:0;pointer-events:none;transition:opacity 240ms var(--ease-standard);z-index:900}
.drawer-scrim.is-open{opacity:1;pointer-events:auto}
.filtrar-panel{position:fixed;top:0;right:0;height:100vh;width:420px;max-width:100vw;background:#fff;border-radius:4px 0 0 4px;box-shadow:0 40px 120px rgba(1,30,65,.2);display:flex;flex-direction:column;transform:translateX(100%);transition:transform 280ms var(--ease-standard);z-index:901}
.filtrar-panel.is-open{transform:none}
.snack-slot{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);z-index:1100}
@media (max-width:900px){
  .consola{padding:24px 20px 48px}
  .consola-head h1{font-size:32px}
  .tabla-wrap{display:none}
  .tabla-cards{display:flex}
  .filtrar-panel{width:100vw;border-radius:0;box-shadow:0 4px 4px rgba(0,0,0,.25)}
  .tabla-pie{justify-content:center;text-align:center}
}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react" src="FiltrarDrawer.jsx"></script>
<script type="text/babel" data-presets="react" src="NegociosTable.jsx"></script>
<script type="text/babel" data-presets="react" src="ConsolaModals.jsx"></script>
<script type="text/babel" data-presets="react">
const { Button: AButton, Icon: AIcon, Chip: AChip, Snackbar: ASnackbar, Badge: ABadge, Alert: AAlert } = window.AseguradoraDelSurDesignSystem_031691;
const D = window.ADSConsola;
const EMPTY_FILTROS = { canal: [], sucursal: [], vendedor: [], tipo: [], plan: [], valor: [5.32, 4800], fecha: null };

function App() {
  const [drawer, setDrawer] = React.useState(false);
  const [draft, setDraft] = React.useState(EMPTY_FILTROS);
  const [applied, setApplied] = React.useState(EMPTY_FILTROS);
  const [q, setQ] = React.useState('');
  const [sort, setSort] = React.useState({ key: 'identificacion', dir: 'asc' });
  const [page, setPage] = React.useState(1);
  const [perPage, setPerPage] = React.useState(20);
  const [modal, setModal] = React.useState(null);
  const [snack, setSnack] = React.useState(null);
  const [aviso, setAviso] = React.useState(true);

  React.useEffect(() => {
    if (!snack) return;
    const t = setTimeout(() => setSnack(null), 3600);
    return () => clearTimeout(t);
  }, [snack]);
  React.useEffect(() => { setPage(1); }, [applied, q, perPage]);

  const filtered = React.useMemo(() => {
    const term = q.trim().toLowerCase();
    return D.rows.filter(r => {
      if (applied.canal.length && !applied.canal.includes(r.canal)) return false;
      if (applied.sucursal.length && !applied.sucursal.includes(r.sucursal)) return false;
      if (applied.vendedor.length && !applied.vendedor.includes(r.vendedor)) return false;
      if (applied.tipo.length && !applied.tipo.includes(r.tipo)) return false;
      if (applied.plan.length && !applied.plan.includes(r.plan)) return false;
      if (r.valor < applied.valor[0] || r.valor > applied.valor[1]) return false;
      if (applied.fecha && r.fecha.toDateString() !== applied.fecha.toDateString()) return false;
      if (term && !(r.cliente + ' ' + r.cotizacion + ' ' + r.identificacion).toLowerCase().includes(term)) return false;
      return true;
    });
  }, [applied, q]);

  const sorted = React.useMemo(() => {
    const s = [...filtered];
    s.sort((a, b) => {
      const va = a[sort.key], vb = b[sort.key];
      const c = typeof va === 'number' ? va - vb : String(va).localeCompare(String(vb), 'es');
      return sort.dir === 'asc' ? c : -c;
    });
    return s;
  }, [filtered, sort]);

  const pageCount = Math.max(1, Math.ceil(sorted.length / perPage));
  const safePage = Math.min(page, pageCount);
  const slice = sorted.slice((safePage - 1) * perPage, safePage * perPage);

  const activos = [];
  ['canal', 'sucursal', 'vendedor', 'tipo', 'plan'].forEach(k => applied[k].forEach(v => activos.push({ k, v })));
  if (applied.fecha) activos.push({ k: 'fecha', v: applied.fecha.toLocaleDateString('es-EC') });
  const rangoActivo = applied.valor[0] !== EMPTY_FILTROS.valor[0] || applied.valor[1] !== EMPTY_FILTROS.valor[1];

  const quitar = (k, v) => {
    const next = k === 'fecha' ? { ...applied, fecha: null } : { ...applied, [k]: applied[k].filter(x => x !== v) };
    setApplied(next); setDraft(next);
  };

  return (
    <React.Fragment>
      <div className="consola">
        <header className="consola-head">
          <div>
            <h1>Negocios</h1>
            <p>Revisa tus cotizaciones, filtra por canal o sucursal y da seguimiento.</p>
          </div>
          <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap' }}>
            <AButton variant="secondary" onClick={() => setModal({ type: 'terminos' })}>Términos y Condiciones</AButton>
            <AButton variant="primary" iconLeft={<AIcon name="FuncionesAdd" size={18} />} onClick={() => setModal({ type: 'siniestro', row: null })}>Reportar siniestro</AButton>
          </div>
        </header>

        {aviso && (
          <AAlert tone="info" title="Cierre de mes" style={{ marginBottom: 20 }} onClose={() => setAviso(false)}>
            El corte de comisiones es el 30 de septiembre a las 18:00. Revisa que tus negocios estén emitidos.
          </AAlert>
        )}

        <div className="toolbar">
          <div className="buscar">
            <AIcon name="FuncionesSearch" size={18} color="var(--text-muted)" />
            <input value={q} onChange={e => setQ(e.target.value)} placeholder="Busca por cliente, cotización o identificación" aria-label="Buscar negocios" />
            {q && <button className="row-eye" onClick={() => setQ('')} aria-label="Limpiar búsqueda"><AIcon name="FuncionesClose" size={16} /></button>}
          </div>
          <AButton variant="secondary" iconLeft={<AIcon name="FuncionesFilter" size={18} />} onClick={() => { setDraft(applied); setDrawer(true); }}>
            Filtrar{activos.length + (rangoActivo ? 1 : 0) > 0 ? ' (' + (activos.length + (rangoActivo ? 1 : 0)) + ')' : ''}
          </AButton>
        </div>

        {(activos.length > 0 || rangoActivo) && (
          <div className="chips-activos">
            {activos.map(a => <AChip key={a.k + a.v} selected onRemove={() => quitar(a.k, a.v)}>{a.v}</AChip>)}
            {rangoActivo && <ABadge tone="teal">$ {applied.valor[0].toFixed(2)} – $ {applied.valor[1].toFixed(2)}</ABadge>}
            <button className="link-clear" onClick={() => { setApplied(EMPTY_FILTROS); setDraft(EMPTY_FILTROS); }}>Limpiar todo</button>
          </div>
        )}

        {sorted.length === 0 && (
          <AAlert tone="warning" title="Sin resultados" style={{ marginBottom: 20 }}
            action={{ label: 'Limpiar filtros', onClick: () => { setApplied(EMPTY_FILTROS); setDraft(EMPTY_FILTROS); setQ(''); } }}>
            Ningún negocio coincide con tu búsqueda. Prueba con menos filtros.
          </AAlert>
        )}

        <NegociosTable
          rows={slice} sort={sort}
          onSort={k => setSort(s => ({ key: k, dir: s.key === k && s.dir === 'asc' ? 'desc' : 'asc' }))}
          page={safePage} pageCount={pageCount} onPage={setPage}
          perPage={perPage} onPerPage={setPerPage}
          total={sorted.length}
          rangeFrom={sorted.length ? (safePage - 1) * perPage + 1 : 0}
          rangeTo={Math.min(safePage * perPage, sorted.length)}
          onView={r => setModal({ type: 'detalle', row: r })}
          onAction={msg => setModal({ type: 'confirmar', mensaje: msg })}
        />
      </div>

      <FiltrarDrawer open={drawer} draft={draft} setDraft={setDraft}
        onClose={() => setDrawer(false)}
        onRestore={() => setDraft(EMPTY_FILTROS)}
        onApply={n => { setApplied(draft); setDrawer(false); setSnack({ tone: 'success', msg: n > 0 ? 'Aplicamos ' + n + ' filtro' + (n === 1 ? '' : 's') + '.' : 'Mostramos todos los negocios.' }); }} />

      {modal && modal.type === 'detalle' && <DetalleModal row={modal.row} onClose={() => setModal(null)} onReport={r => setModal({ type: 'siniestro', row: r })} />}
      {modal && modal.type === 'siniestro' && <SiniestroModal row={modal.row} onClose={() => setModal(null)} onSubmit={() => { setModal(null); setSnack({ tone: 'success', msg: 'Recibimos tu reporte. Te contactamos en menos de 24 horas.' }); }} />}
      {modal && modal.type === 'terminos' && <TerminosModal onClose={() => setModal(null)} onAccept={() => { setModal(null); setSnack({ tone: 'success', msg: 'Gracias, aceptaste los términos y condiciones.' }); }} />}
      {modal && modal.type === 'confirmar' && <ConfirmarModal mensaje={modal.mensaje} onClose={() => setModal(null)} onConfirm={() => { setModal(null); setSnack({ tone: 'default', msg: modal.mensaje }); }} />}

      {snack && <div className="snack-slot"><ASnackbar tone={snack.tone} icon={<AIcon name="InformativoCircleCheck" size={20} />}>{snack.msg}</ASnackbar></div>}
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
