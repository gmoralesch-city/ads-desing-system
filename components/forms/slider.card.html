<!-- @dsCard group="Forms" viewport="700x210" name="Slider" subtitle="Rango de monto asegurado y deducible — interactivo y disabled" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:28px;background:var(--surface-page);font-family:var(--font-brand)}.cap{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);margin:0 0 9px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px 40px;max-width:640px}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
  const { Slider } = window.AseguradoraDelSurDesignSystem_031691;
  const Cell = ({t,children}) => <div><p className="cap">{t}</p>{children}</div>;
  function App(){
    const [monto,setMonto]=React.useState(20000);
    const [ded,setDed]=React.useState(350);
    return (<div className="grid">
      <Cell t="Interactivo"><Slider label="Monto asegurado" min={5000} max={50000} step={1000} value={monto} onChange={setMonto} formatValue={n=>'$'+n.toLocaleString('es-EC')} /></Cell>
      <Cell t="Interactivo · paso fino"><Slider label="Deducible" min={100} max={1000} step={50} value={ded} onChange={setDed} formatValue={n=>'$'+n} /></Cell>
    </div>);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
