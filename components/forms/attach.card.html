<!-- @dsCard group="Forms" viewport="700x300" name="Attach" subtitle="Adjuntar archivos — vacío, con archivos y con hint" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:28px;background:var(--surface-page);font-family:var(--font-brand)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:26px 40px;max-width:640px;align-items:start}.label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);margin:0 0 12px}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
  const { Attach } = window.AseguradoraDelSurDesignSystem_031691;
  function App() {
    const [files, setFiles] = React.useState([{ name: 'cedula-frontal.jpg' }, { name: 'matricula-2026.pdf' }]);
    return (
      <div className="grid">
        <div>
          <p className="label">Vacío</p>
          <Attach label="Adjuntar documentos" hint="PDF o JPG, máx. 5 MB" />
        </div>
        <div>
          <p className="label">Con archivos</p>
          <Attach label="Adjuntar documentos" files={files}
                  onRemove={i => setFiles(files.filter((_, n) => n !== i))} />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
