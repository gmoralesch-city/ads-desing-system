<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
  const { Table, ListItem, Box, Calendar, Insignia, Badge } = window.AseguradoraDelSurDesignSystem_031691;
  const rows=[{poliza:'VEH-0912',ramo:'Vehicular',estado:<Badge tone="success">Vigente</Badge>,monto:'98,00'},{poliza:'VID-3320',ramo:'Vida',estado:<Badge tone="warning">Por vencer</Badge>,monto:'42,00'},{poliza:'HOG-1188',ramo:'Hogar',estado:<Badge tone="success">Vigente</Badge>,monto:'65,00'}];

        </div>
        <div>
          <p className="label">Calendar</p>
          <Calendar value={fecha} onChange={setFecha}/>
        </div>
      </div>
      <div className="row">
        <div style={{flex:1,minWidth:280}}>
          <p className="label">Box &amp; list items</p>
          <Box title="Mis pólizas" padded={false}>
            <div style={{padding:'4px 16px'}}>

            </div>
          </Box>
        </div>
      </div>
    </div>);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
