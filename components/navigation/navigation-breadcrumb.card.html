<!DOCTYPE html>
<html lang="es">
<head>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
  const { Breadcrumb, Menu, Dropdown, Link, Pagination, Button } = window.AseguradoraDelSurDesignSystem_031691;
  const Shield=()=>(<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>);
  const Bolt=()=>(<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></svg>);
  const Card2=()=>(<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>);
  const Arrow=()=>(<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>);
  function App(){
    const [tab,setTab]=React.useState('polizas');
    const [page,setPage]=React.useState(3);
    return (<div>
      <Breadcrumb items={[{label:'Inicio',href:'#'},{label:'Seguros',href:'#'},{label:'Vehicular'}]} style={{marginBottom:22}}/>
      <div className="row">
        <div style={{width:240}}>
          <p className="label">Menu</p>
          <Menu value={tab} onChange={setTab} items={[
            {label:'Mis pólizas',value:'polizas',icon:<Shield/>},
            {label:'Siniestros',value:'siniestros',icon:<Bolt/>,badge:2},
            {label:'Pagos',value:'pagos',icon:<Card2/>},
          ]}/>
        </div>
        <div>
          <p className="label">Dropdown &amp; link</p>
          <div style={{display:'flex',flexDirection:'column',gap:16,alignItems:'flex-start'}}>
            <Dropdown trigger={<Button variant="secondary">Cuenta ▾</Button>} items={[{label:'Mi perfil'},{label:'Configuración'},{divider:true},{label:'Cerrar sesión',danger:true}]}/>
            <Link href="#" iconRight={<Arrow/>}>Ver todos mis siniestros</Link>
          </div>
        </div>
      </div>
      <p className="label">Pagination</p>
      <Pagination page={page} pageCount={12} onChange={setPage}/>
    </div>);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
