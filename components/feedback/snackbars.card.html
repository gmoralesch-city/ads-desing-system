<!-- @dsCard group="Components" viewport="700x280" name="Feedback · Snack bars" subtitle="350×70 · 4 tonos con barra de estado y cierre" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:24px;background:var(--surface-page);font-family:var(--font-brand)}.label{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);margin:0}.grid{display:grid;grid-template-columns:repeat(2,max-content);gap:18px 28px}.cell{display:flex;flex-direction:column;gap:6px}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
  const { Snackbar } = window.AseguradoraDelSurDesignSystem_031691;
  const MSG = "Aquí va el mensaje que se quiere comunicar.";
  const TONES = [['info','Informativo'],['warning','Advertencia'],['success','Exitoso'],['danger','Fallido']];
  function App(){return (<div className="grid">
    {TONES.map(([tone,name]) => (
      <div className="cell" key={tone}>
        <p className="label">{name}</p>
        <Snackbar tone={tone} onClose={()=>{}}>{MSG}</Snackbar>
      </div>
    ))}
  </div>);}
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
