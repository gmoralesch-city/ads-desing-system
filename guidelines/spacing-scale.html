<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base grid" -->
<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:28px;background:#fff;font-family:var(--font-brand);}
  .row{display:flex;align-items:flex-end;gap:18px;}
  .item{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .bar{background:var(--cyan-500);border-radius:2px;width:100%;}
  .lab{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums;}
  .item span:first-child{font-size:12px;font-weight:700;color:var(--text-strong);}
</style></head>
<body>
<div class="row">
  <div class="item"><span>1</span><div class="bar" style="height:var(--space-1);width:var(--space-1)"></div><span class="lab">4</span></div>
  <div class="item"><span>2</span><div class="bar" style="height:var(--space-2);width:var(--space-2)"></div><span class="lab">8</span></div>
  <div class="item"><span>3</span><div class="bar" style="height:var(--space-3);width:var(--space-3)"></div><span class="lab">12</span></div>
  <div class="item"><span>4</span><div class="bar" style="height:var(--space-4);width:var(--space-4)"></div><span class="lab">16</span></div>
  <div class="item"><span>6</span><div class="bar" style="height:var(--space-6);width:var(--space-6)"></div><span class="lab">24</span></div>
  <div class="item"><span>8</span><div class="bar" style="height:var(--space-8);width:var(--space-8)"></div><span class="lab">32</span></div>
  <div class="item"><span>12</span><div class="bar" style="height:var(--space-12);width:var(--space-12)"></div><span class="lab">48</span></div>
  <div class="item"><span>16</span><div class="bar" style="height:var(--space-16);width:var(--space-16)"></div><span class="lab">64</span></div>
  <div class="item"><span>20</span><div class="bar" style="height:var(--space-20);width:var(--space-20)"></div><span class="lab">80</span></div>
</div>
</body></html>
