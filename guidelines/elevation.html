<!-- @dsCard group="Spacing" viewport="700x200" name="Elevation" subtitle="Shadow system — button glow, cards, modal" -->
<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:34px 28px;background:#fff;font-family:var(--font-brand);}
  .row{display:flex;gap:34px;align-items:flex-start;}
  .item{display:flex;flex-direction:column;gap:12px;align-items:center;}
  .box{width:120px;height:84px;background:#fff;border-radius:var(--radius-md);}
  .n{font-size:12px;font-weight:700;color:var(--text-strong);}
  .v{font-size:10.5px;color:var(--text-muted);text-align:center;max-width:130px;line-height:1.4;}
</style></head>
<body>
<div class="row">
  <div class="item"><div class="box" style="box-shadow:var(--shadow-button)"></div><span class="n">button</span><span class="v">0 4 8 · cyan/24%</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><span class="n">sm · cajita</span><span class="v">0 4 8 · navy/12%</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><span class="n">md · caja</span><span class="v">0 12 20 · navy/8%</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-modal)"></div><span class="n">modal</span><span class="v">0 20 80 · navy/12%</span></div>
</div>
</body></html>
