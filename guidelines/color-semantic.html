<!-- @dsCard group="Colors" viewport="700x150" name="Semantic" subtitle="Success · warning · danger · teal accent" -->
<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:24px;font-family:var(--font-brand);background:#fff;}
  .swatches{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm);}
  .sw{flex:1;height:104px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;box-sizing:border-box;}
  .name{font-size:13px;font-weight:700;}
  .hex{font-size:12px;opacity:.85;font-variant-numeric:tabular-nums;}
</style></head>
<body>
<div class="swatches">
  <div class="sw" style="background:var(--green-500);color:#fff"><span class="name">success</span><span class="hex">#4C8C1E</span></div>
  <div class="sw" style="background:var(--gold-500);color:#fff"><span class="name">warning</span><span class="hex">#C99A06</span></div>
  <div class="sw" style="background:var(--red-500);color:#fff"><span class="name">danger</span><span class="hex">#9E1B0E</span></div>
  <div class="sw" style="background:var(--teal-500);color:#fff"><span class="name">teal</span><span class="hex">#4F8488</span></div>
  <div class="sw" style="background:var(--teal-100);color:var(--blue-900)"><span class="name">teal-100</span><span class="hex">#E8F4F4</span></div>
</div>
</body></html>
