<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:24px;background:#fff;font-family:var(--font-brand);}
  .grid{display:flex;gap:18px;align-items:stretch;}
  .cell{border:1px solid var(--border-subtle);border-radius:var(--radius-md);overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:200px;}
  .illus{flex:0 0 230px;background:#fff;padding:16px;box-sizing:border-box;}
  .hero{flex:1;background:var(--surface-brand);}
</style></head>
<body>
<div class="grid">
  <div class="cell illus"><img src="../assets/illustrations/empty-state.png" alt="Empty state" style="max-height:180px;max-width:100%;"></div>
  <div class="cell hero"><img src="../assets/images/hero-app-hands.png" alt="App hero" style="width:100%;height:100%;object-fit:cover;object-position:right;"></div>
</div>
</body></html>
