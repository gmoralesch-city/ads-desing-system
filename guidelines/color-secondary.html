<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:24px;font-family:var(--font-brand);background:#fff;}
  .swatches{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm);}
  .sw{flex:1;height:104px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;box-sizing:border-box;}
  .name{font-size:13px;font-weight:700;}
  .hex{font-size:12px;opacity:.85;font-variant-numeric:tabular-nums;}
</style></head>
<body>
<div class="swatches">
  <div class="sw" style="background:var(--blue-900);color:#fff"><span class="name">blue-900</span><span class="hex">#011E41</span></div>
  <div class="sw" style="background:var(--blue-800);color:#fff"><span class="name">blue-800</span><span class="hex">#183154</span></div>
  <div class="sw" style="background:var(--blue-700);color:#fff"><span class="name">blue-700 ★</span><span class="hex">#0033A1</span></div>
  <div class="sw" style="background:var(--blue-500);color:#fff"><span class="name">blue-500</span><span class="hex">#1E50D6</span></div>
  <div class="sw" style="background:var(--blue-100);color:var(--blue-900)"><span class="name">blue-100</span><span class="hex">#F1F5FF</span></div>
</div>
</body></html>
