<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:24px;background:#fff;font-family:var(--font-brand);}
  .grid{display:flex;gap:18px;align-items:stretch;}
  .cell{flex:1;border:1px solid var(--border-subtle);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;padding:20px;min-height:150px;}
  .navy{background:var(--blue-900);border-color:var(--blue-900);}
  .teal{background:var(--teal-100);border-color:var(--teal-100);}
</style></head>
<body>
<div class="grid">
  <div class="cell"><img src="../assets/logos/ads-vertical.png" alt="ADS vertical" style="max-height:130px;max-width:100%;"></div>
  <div class="cell teal"><img src="../assets/logos/ads-horizontal.png" alt="ADS horizontal" style="max-height:78px;max-width:100%;"></div>
  <div class="cell navy"><img src="../assets/logos/ads-isotipo.svg" alt="Isotipo" style="height:104px;"></div>
</div>
</body></html>
