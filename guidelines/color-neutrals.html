<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals — Grises" subtitle="Text, surfaces and borders" -->
<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:24px;font-family:var(--font-brand);background:#fff;}
  .swatches{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm);}
  .sw{flex:1;height:104px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;box-sizing:border-box;}
  .name{font-size:13px;font-weight:700;}
  .hex{font-size:12px;opacity:.85;font-variant-numeric:tabular-nums;}
</style></head>
<body>
<div class="swatches">
  <div class="sw" style="background:var(--neutral-900);color:#fff"><span class="name">900</span><span class="hex">#011E41</span></div>
  <div class="sw" style="background:var(--neutral-700);color:#fff"><span class="name">700</span><span class="hex">#484848</span></div>
  <div class="sw" style="background:var(--neutral-500);color:#fff"><span class="name">500</span><span class="hex">#787878</span></div>
  <div class="sw" style="background:var(--neutral-400);color:var(--blue-900)"><span class="name">400</span><span class="hex">#B4B4B4</span></div>
  <div class="sw" style="background:var(--neutral-300);color:var(--blue-900)"><span class="name">300</span><span class="hex">#DADADA</span></div>
  <div class="sw" style="background:var(--neutral-100);color:var(--blue-900)"><span class="name">100</span><span class="hex">#F4F4F4</span></div>
  <div class="sw" style="background:var(--white);color:var(--blue-900)"><span class="name">white</span><span class="hex">#FFFFFF</span></div>
</div>
</body></html>
