<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:28px;background:#fff;}
  .row{display:flex;align-items:baseline;gap:16px;padding:7px 0;border-bottom:1px solid var(--border-subtle);}
  .meta{font-family:var(--font-brand);font-size:11px;color:var(--text-muted);width:96px;flex:0 0 auto;font-variant-numeric:tabular-nums;}
  .sample{color:var(--text-strong);line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
</style></head>
<body>
  <div class="row"><span class="meta">H1 · 48 · Light</span><span class="sample" style="font-family:var(--font-brand);font-weight:300;font-size:48px;">Tranquilidad</span></div>
  <div class="row"><span class="meta">H2 · 44 · Light</span><span class="sample" style="font-family:var(--font-brand);font-weight:300;font-size:44px;">Tu seguro de vida</span></div>
  <div class="row"><span class="meta">H3 · 40 · Medium</span><span class="sample" style="font-family:var(--font-brand);font-weight:500;font-size:40px;">Nuestros seguros</span></div>
  <div class="row"><span class="meta">H4 · 36 · Medium</span><span class="sample" style="font-family:var(--font-brand);font-weight:500;font-size:36px;">Contrata con nosotros</span></div>
  <div class="row"><span class="meta">H5 · 32 · Bold</span><span class="sample" style="font-family:var(--font-brand);font-weight:700;font-size:32px;">Protección total</span></div>
  <div class="row"><span class="meta">H6 · 28 · Medium</span><span class="sample" style="font-family:var(--font-brand);font-weight:500;font-size:28px;">Soporte 24/7</span></div>
</body></html>
