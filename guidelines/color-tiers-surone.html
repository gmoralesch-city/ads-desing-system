<!-- @dsCard group="Colors" viewport="700x150" name="Tiers & Sur One" subtitle="Plan tiers and the Sur One sub-brand" -->
<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:24px;font-family:var(--font-brand);background:#fff;}
  .swatches{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm);}
  .sw{flex:1;height:104px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;box-sizing:border-box;}
  .name{font-size:13px;font-weight:700;}
  .hex{font-size:12px;opacity:.85;font-variant-numeric:tabular-nums;}
</style></head>
<body>
<div class="swatches">
  <div class="sw" style="background:var(--tier-bronce);color:#fff"><span class="name">Bronce</span><span class="hex">#B5732B</span></div>
  <div class="sw" style="background:var(--tier-plata);color:#fff"><span class="name">Plata</span><span class="hex">#8B9097</span></div>
  <div class="sw" style="background:var(--tier-oro);color:#fff"><span class="name">Oro</span><span class="hex">#C99A06</span></div>
  <div class="sw" style="background:var(--surone-purple);color:#fff"><span class="name">Sur purple</span><span class="hex">#4D16C4</span></div>
  <div class="sw" style="background:var(--surone-pink);color:#fff"><span class="name">Sur pink</span><span class="hex">#FE49A8</span></div>
</div>
</body></html>
