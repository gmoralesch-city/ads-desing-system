<!-- @dsCard group="Colors" viewport="700x150" name="Primary — Cyan" subtitle="The signature ADS brand color" -->
<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:24px;font-family:var(--font-brand);background:#fff;}
  .swatches{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm);}
  .sw{flex:1;height:104px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;box-sizing:border-box;}
  .name{font-size:13px;font-weight:700;}
  .hex{font-size:12px;opacity:.85;font-variant-numeric:tabular-nums;}
</style></head>
<body>
<div class="swatches">
  <div class="sw" style="background:var(--cyan-700);color:#fff"><span class="name">cyan-700</span><span class="hex">#008BBF</span></div>
  <div class="sw" style="background:var(--cyan-500);color:#fff"><span class="name">cyan-500 ★</span><span class="hex">#00AEEF</span></div>
  <div class="sw" style="background:var(--cyan-300);color:var(--blue-900)"><span class="name">cyan-300</span><span class="hex">#5BC8F5</span></div>
  <div class="sw" style="background:var(--cyan-100);color:var(--blue-900)"><span class="name">cyan-100</span><span class="hex">#C9EEFB</span></div>
</div>
</body></html>
