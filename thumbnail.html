<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0;height:100%}
  .tile{display:flex;width:1280px;height:854px;font-family:var(--font-brand)}
  .main{flex:1;background:var(--cyan-500);display:flex;align-items:center;justify-content:center}
  .main img{width:52%;height:auto}
  .strip{display:flex;flex-direction:column;width:200px}
  .strip span{flex:1;display:block}
</style>
</head>
<body>
<div class="tile">
  <div class="main"><img src="assets/logos/ads-isotipo.svg" alt="Aseguradora del Sur"></div>
  <div class="strip">
    <span style="background:#C99A06"></span>
    <span style="background:#4F8488"></span>
    <span style="background:#0033A1"></span>
    <span style="background:#011E41"></span>
  </div>
</div>
</body>
</html>
